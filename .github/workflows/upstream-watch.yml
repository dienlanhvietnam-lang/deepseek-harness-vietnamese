name: Upstream watch

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check DeepSeek Harness upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(node -p "require('./translations/meta.json').upstream.commit")"
          latest="$(git ls-remote https://github.com/deepseek-ai/deepseek-harness.git refs/heads/master | cut -f1)"
          echo "audited=$current"
          echo "upstream=$latest"
          if [ "$current" = "$latest" ]; then
            exit 0
          fi
          title="Upstream DeepSeek Harness changed: audit Vietnamese coverage"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create               --title "$title"               --body "The audited upstream commit is `$current`, while current master is `$latest`. Run the namespace/coverage sync before the next release."
          fi
