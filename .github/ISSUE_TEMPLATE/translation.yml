name: Translation improvement
description: Suggest a Vietnamese wording or report an untranslated DSH string
title: "[translation] "
labels: ["translation"]
body:
  - type: input
    id: namespace
    attributes:
      label: Namespace
      placeholder: e.g. settings.models
    validations:
      required: true
  - type: input
    id: key
    attributes:
      label: Key
      placeholder: e.g. title
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Vietnamese text
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this better?
